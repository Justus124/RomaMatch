  function exportData(revision) {
    var copy = clone(state);
    copy.revision = revision;
    delete copy.baseRevision;
    delete copy.dirty;
    copy.community.forEach(function (c) { delete c.own; });
    copy.likes.forEach(function (l) { delete l.own; });
    return copy;
  }

  function readImageFile(file) {
    return new Promise(function (resolve, reject) {
      if (!file || !/^image\//.test(file.type)) { reject(new Error('Bitte eine Bilddatei auswählen.')); return; }
      var reader = new FileReader();
      reader.onerror = function () { reject(new Error('Die Datei konnte nicht gelesen werden.')); };
      reader.onload = function () {
        var img = new Image();
        img.onerror = function () { reject(new Error('Das Bild konnte nicht geöffnet werden.')); };
        img.onload = function () {
          // Verkleinern, damit der Browserspeicher (ca. 5 MB) nicht volläuft.
          var max = 640;
          var scale = Math.min(1, max / Math.max(img.width, img.height));
          var canvas = document.createElement('canvas');
          canvas.width = Math.max(1, Math.round(img.width * scale));
          canvas.height = Math.max(1, Math.round(img.height * scale));
          var ctx = canvas.getContext('2d');
          ctx.fillStyle = '#2c211e';
          ctx.fillRect(0, 0, canvas.width, canvas.height);
          ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
          resolve(canvas.toDataURL('image/jpeg', 0.82));
        };
        img.src = reader.result;
      };
      reader.readAsDataURL(file);
    });
  }

  function setImagePreview(src) {
    var preview = document.getElementById('mp-image-preview');
    if (!preview) return;
    preview.hidden = !src;
    preview.querySelector('img').src = src || '';
  }

  /* =======================================================
     Aktionen (Klicks)
     ======================================================= */

  function swipe(direction) {
    var profiles = sortedProfiles();
    var current = profiles[ui.swipeIndex];
    if (!current || ui.swipeBusy) return;
    ui.swipeBusy = true;

    var card = document.getElementById('swipe-card');
    if (card) {
      card.style.transition = '';
      card.style.transform = '';
      card.classList.add(direction === 'like' ? 'leaving-like' : 'leaving-nope');
    }
    root.querySelectorAll('.circle-btn').forEach(function (b) { b.disabled = true; });

    if (direction === 'like') {
      state.likes.push({
        id: uid(), profileId: current.id, likerName: likerName().trim() || 'Anonymus',
        userProfileId: null, createdAt: nowIso(), own: true
      });
      save();
      ui.listedId = current.id;
    }

    setTimeout(function () {
      ui.swipeBusy = false;
      ui.swipeIndex += 1;
      if (direction === 'like') ui.matchedId = current.id;
      render();
    }, 340);
  }

  var actions = {
    noop: function () {},

    tab: function (el) {
      ui.tab = el.getAttribute('data-tab');
      ui.flash = null;
      ui.animate = true;
      render();
      var nav = root.querySelector('.nav');
      if (nav) {
        var top = nav.getBoundingClientRect().top + window.scrollY;
        if (el.hasAttribute('data-scroll') || window.scrollY > top) window.scrollTo({ top: top, behavior: reducedMotion ? 'auto' : 'smooth' });
      }
      var active = root.querySelector('.nav-tab[aria-selected="true"]');
      if (active && active.scrollIntoView) active.scrollIntoView({ block: 'nearest', inline: 'center' });
    },
    reveal: function (el) { el.classList.toggle('revealed'); },
    'reveal-all': function () { ui.revealAll = !ui.revealAll; render(); },
    vote: function (el) {
      var votes = readVotes();
      var id = el.getAttribute('data-id'), v = el.getAttribute('data-v');
      if (votes[id] === v) delete votes[id]; else votes[id] = v;
      storageSet(localStorage, VOTES_KEY, JSON.stringify(votes));
      render();
    },
    'style-pick': function (el) {
      var id = el.getAttribute('data-id');
      var done = function () { return STYLE_ITEMS.filter(function (it) { return ui.styleFixed[it.id]; }).length; };
      var before = done();
      ui.styleSel = id;
      ui.styleFixed[id] = true;
      ui.styleCelebrate = before < STYLE_ITEMS.length && done() === STYLE_ITEMS.length;
      render();
    },
    'style-all': function () {
      STYLE_ITEMS.forEach(function (it) { ui.styleFixed[it.id] = true; });
      ui.styleCelebrate = true;
      render();
    },
    'style-reset': function () { ui.styleFixed = {}; ui.styleSel = null; render(); },
    seat: function (el) {
      var seat = el.getAttribute('data-seat');
      ui.seat = ui.seat === seat ? null : seat;
      render();
    },
    team: function (el) {
      var hers = TEAMS[Math.floor(Math.random() * TEAMS.length)].id;
      ui.team = { mine: el.getAttribute('data-team'), hers: hers };
      render();
    },
    'quiz-answer': function (el) {
      var qz = ui.quiz;
      if (!qz || qz.picked !== null) return;
      qz.picked = Number(el.getAttribute('data-k'));
      qz.results[qz.step] = qz.picked === 0;
      if (qz.picked === 0) qz.score += 1;
      render();
    },
    'quiz-next': function () {
      ui.quiz.step += 1;
      ui.quiz.picked = null;
      render();
    },
    'quiz-restart': function () { startQuiz(); ui.animate = true; render(); },
    like: function () { swipe('like'); },
    nope: function () { swipe('nope'); },
    restart: function () { ui.swipeIndex = 0; render(); },
    'close-match': function () { ui.matchedId = null; render(); },

    'admin-tab': function (el) {
      ui.adminSection = el.getAttribute('data-section');
      ui.flash = null;
      ui.editTipId = null;
      ui.editProfileId = null;
      render();
    },
    logout: function () {
      storageRemove(sessionStorage, SESSION_KEY);
      ui.flash = null;
      render();
    },
    'cancel-edit': function () {
      ui.editTipId = null;
      ui.editProfileId = null;
      ui.flash = null;
      render();
    },

    'edit-tip': function (el) {
      ui.editTipId = el.getAttribute('data-id');
      ui.flash = null;
      render();
      scrollToForm();
    },
    'delete-tip': function (el) {
      var tip = findById('tips', el.getAttribute('data-id'));
      if (!tip || !confirm('Tipp „' + tip.title + '“ wirklich löschen?')) return;
      state.tips = state.tips.filter(function (t) { return t.id !== tip.id; });
      if (ui.editTipId === tip.id) ui.editTipId = null;
      saveAdminChange();
      setFlash('admin', 'success', 'Tipp „' + tip.title + '“ gelöscht.');
      render();
    },

    'edit-profile': function (el) {
      ui.editProfileId = el.getAttribute('data-id');
      ui.flash = null;
      render();
      scrollToForm();
    },
    'delete-profile': function (el) {
      var profile = findById('profiles', el.getAttribute('data-id'));
      if (!profile) return;
      var count = likesFor(profile.id).length;
      if (!confirm('Profil „' + profile.name + '“ löschen? ' + plural(count, 'zugehöriges Like wird', 'zugehörige Likes werden') + ' mit entfernt.')) return;
      state.profiles = state.profiles.filter(function (p) { return p.id !== profile.id; });
      state.likes = state.likes.filter(function (l) { return l.profileId !== profile.id; });
      if (ui.editProfileId === profile.id) ui.editProfileId = null;
      if (ui.listedId === profile.id) ui.listedId = null;
      ui.swipeIndex = 0;
      saveAdminChange();
      setFlash('admin', 'success', 'Profil „' + profile.name + '“ gelöscht.');
      render();
    },
    'remove-image': function () {
      var urlInput = document.getElementById('mp-image-url');
      var dataInput = document.getElementById('mp-image-data');
      if (urlInput) urlInput.value = '';
      if (dataInput) dataInput.value = '';
      setImagePreview('');
    },

    'delete-community': function (el) {
      var person = findById('community', el.getAttribute('data-id'));
      if (!person || !confirm('Profil von „' + person.name + '“ endgültig löschen?')) return;
      state.community = state.community.filter(function (c) { return c.id !== person.id; });
      // Das über die Checkbox entstandene Ovid-Like gehört zum Profil.
      state.likes = state.likes.filter(function (l) { return l.userProfileId !== person.id; });
      saveAdminChange();
      setFlash('admin', 'success', 'Profil von ' + person.name + ' gelöscht.');
      render();
    },

    'export-html': function () {
      var revision = Date.now();
      var json = JSON.stringify(exportData(revision), null, 1).replace(/</g, '\\u003c');
      var doc = document.documentElement.cloneNode(true);
      doc.querySelector('#root').innerHTML = '';
      doc.querySelector('#roma-data').textContent = json;
      download('roma-match.html', '<!DOCTYPE html>\n' + doc.outerHTML, 'text/html;charset=utf-8');

      // Dieser Browser kennt den Stand jetzt – öffnet der Admin die neue
      // Datei hier, gilt sie nicht als "neuer" und nichts wird überschrieben.
      state.revision = revision;
      state.baseRevision = revision;
      state.dirty = false;
      save();
      setFlash('admin', 'success', 'HTML-Datei erstellt. Jetzt die alte roma-match.html damit ersetzen (z. B. auf dem Server) – dann sehen alle den neuen Stand.');
      render();
    },
    'export-json': function () {
      var stamp = new Date().toISOString().slice(0, 10);
      download('roma-match-sicherung-' + stamp + '.json', JSON.stringify(exportData(state.revision), null, 2), 'application/json');
      setFlash('admin', 'success', 'Sicherung heruntergeladen.');
      render();
    },
    'clear-likes': function () {
      if (!confirm('Wirklich alle ' + plural(state.likes.length, 'Like', 'Likes') + ' löschen?')) return;
      state.likes = [];
      saveAdminChange();
      setFlash('admin', 'success', 'Alle Likes gelöscht.');
      render();
    },
    'reset-all': function () {
      if (!confirm('Alle Änderungen in diesem Browser verwerfen und zum Stand der Datei zurückkehren?')) return;
      storageRemove(localStorage, STORAGE_KEY);
      state = fileData();
      save();
      ui.swipeIndex = 0;
      ui.listedId = null;
      ui.editTipId = null;
      ui.editProfileId = null;
      if (!isLoggedIn()) { location.hash = '#start'; return; }
      setFlash('admin', 'success', 'Zurückgesetzt auf den Stand der Datei.');
      render();
    }
  };

  /* =======================================================
     Formulare
     ======================================================= */

  function formValues(form) {
    var values = {};
    new FormData(form).forEach(function (value, key) { values[key] = typeof value === 'string' ? value.trim() : value; });
    return values;
  }

  var forms = {
    community: function (form) {
      var v = formValues(form);
      var age = Number(v.age);
      if (!v.name) return formError(form, 'Bitte einen Namen eintragen.');
      if (!Number.isInteger(age) || age < 10 || age > 120) return formError(form, 'Das Alter muss zwischen 10 und 120 liegen.');
      if (!v.bio) return formError(form, 'Bitte ein paar Worte über dich schreiben.');

      var person = {
        id: uid(), name: v.name.slice(0, 60), age: age, bio: v.bio.slice(0, 1000),
        interests: splitTags(v.interests), likedOvid: v.likedOvid === 'on', createdAt: nowIso(), own: true
      };
      state.community.push(person);

      var message = 'Profil gespeichert. ' + person.name + ' steht jetzt im Community-Bereich.';
      if (person.likedOvid) {
        var ovid = sortedProfiles().filter(function (p) { return /ovid/i.test(p.name); })[0];
        if (ovid) {
          state.likes.push({
            id: uid(), profileId: ovid.id, likerName: person.name, userProfileId: person.id,
            createdAt: nowIso(), own: true
          });
          message += ' Dein Like für Ovid wurde ebenfalls eingetragen.';
        }
      }
      save();
      setFlash('profile', 'success', message);
      render();
    },

    login: function (form) {
      var v = formValues(form);
      if (hashPassword(v.password || '') === state.adminHash) {
        storageSet(sessionStorage, SESSION_KEY, state.adminHash);
        ui.loginError = null;
        ui.flash = null;
      } else {
        ui.loginError = 'Falsches Passwort.';
      }
      render();
    },

    tip: function (form) {
      var v = formValues(form);
      var required = [['title', 'Titel'], ['ovidIdea', 'Ovids Idee'], ['latinQuote', 'Lateinisches Zitat'],
        ['translation', 'Deutsche Übersetzung'], ['modernInterpretation', 'Moderne Interpretation']];
      for (var i = 0; i < required.length; i++) {
        if (!v[required[i][0]]) return formError(form, 'Das Feld „' + required[i][1] + '“ darf nicht leer sein.');
      }
      var data = {
        title: v.title.slice(0, 160), ovidIdea: v.ovidIdea.slice(0, 2000), latinQuote: v.latinQuote.slice(0, 1000),
        translation: v.translation.slice(0, 1000), modernInterpretation: v.modernInterpretation.slice(0, 2000),
        source: (v.source || '').slice(0, 120), sortOrder: wholeNumber(v.sortOrder, 0, 999, 0)
      };
      var existing = ui.editTipId ? findById('tips', ui.editTipId) : null;
      if (existing) {
        Object.assign(existing, data);
        setFlash('admin', 'success', 'Tipp „' + data.title + '“ gespeichert.');
      } else {
        data.id = uid();
        data.createdAt = nowIso();
        state.tips.push(data);
        setFlash('admin', 'success', 'Tipp „' + data.title + '“ angelegt.');
      }
      ui.editTipId = null;
      saveAdminChange();
      render();
    },

    profile: function (form) {
      var v = formValues(form);
      var required = [['name', 'Name'], ['era', 'Zeitalter'], ['status', 'Stand'], ['description', 'Beschreibung']];
      for (var i = 0; i < required.length; i++) {
        if (!v[required[i][0]]) return formError(form, 'Das Feld „' + required[i][1] + '“ darf nicht leer sein.');
      }
      var image = v.imageData || v.imageUrlText || '';
      if (image && !safeImage(image)) {
        return formError(form, 'Die Bild-Adresse muss mit https:// oder http:// beginnen.');
      }
      var data = {
        name: v.name.slice(0, 80), era: v.era.slice(0, 120), status: v.status.slice(0, 160),
        description: v.description.slice(0, 2000), tags: splitTags(v.tags), imageUrl: safeImage(image),
        sortOrder: wholeNumber(v.sortOrder, 0, 999, 0)
      };
      var existing = ui.editProfileId ? findById('profiles', ui.editProfileId) : null;
      if (existing) {
        Object.assign(existing, data);
        setFlash('admin', 'success', 'Profil „' + data.name + '“ gespeichert.');
      } else {
        data.id = uid();
        data.createdAt = nowIso();
        state.profiles.push(data);
        setFlash('admin', 'success', 'Profil „' + data.name + '“ angelegt.');
      }
      ui.editProfileId = null;
      ui.swipeIndex = 0;
      saveAdminChange();
      render();
    },

    password: function (form) {
      var v = formValues(form);
      if (hashPassword(v.current || '') !== state.adminHash) return formError(form, 'Das aktuelle Passwort stimmt nicht.');
      if ((v.next || '').length < 6) return formError(form, 'Das neue Passwort braucht mindestens 6 Zeichen.');
      if (v.next !== v.repeat) return formError(form, 'Die beiden neuen Passwörter stimmen nicht überein.');
      state.adminHash = hashPassword(v.next);
      storageSet(sessionStorage, SESSION_KEY, state.adminHash);
      saveAdminChange();
      setFlash('admin', 'success', 'Passwort geändert. In anderen Browsern gilt es erst, wenn dort die neu heruntergeladene HTML-Datei geöffnet wird.');
      render();
    }
  };

  /* =======================================================
     Ereignisse
     ======================================================= */

  root.addEventListener('click', function (event) {
    var el = event.target.closest('[data-action]');
    if (!el || !root.contains(el)) return;
    var handler = actions[el.getAttribute('data-action')];
    if (handler) handler(el, event);
  });

  root.addEventListener('submit', function (event) {
    var form = event.target.closest('form[data-form]');
    if (!form) return;
    event.preventDefault();
    var handler = forms[form.getAttribute('data-form')];
    if (handler) handler(form);
  });

  root.addEventListener('input', function (event) {
    if (event.target.id === 'liker-name') storageSet(localStorage, NAME_KEY, event.target.value.trim());
    if (event.target.id === 'mp-image-url') {
      var dataInput = document.getElementById('mp-image-data');
      if (dataInput) dataInput.value = '';
      setImagePreview(safeImage(event.target.value));
    }
  });

  root.addEventListener('change', function (event) {
    var input = event.target;

    if (input.id === 'mp-image-file' && input.files && input.files[0]) {
      readImageFile(input.files[0]).then(function (dataUrl) {
        document.getElementById('mp-image-data').value = dataUrl;
        document.getElementById('mp-image-url').value = '';
        setImagePreview(dataUrl);
      }).catch(function (error) {
        formError(document.getElementById('admin-form'), error.message);
      });
      input.value = '';
    }

    if (input.id === 'import-file' && input.files && input.files[0]) {
      var file = input.files[0];
      input.value = '';
      file.text().then(function (content) {
        var imported = normalize(JSON.parse(content));
        if (!confirm('Inhalte aus „' + file.name + '“ übernehmen? ' + plural(imported.profiles.length, 'Profil', 'Profile') + ', ' + plural(imported.tips.length, 'Tipp', 'Tipps') + ', ' + plural(imported.community.length, 'Community-Profil', 'Community-Profile') + '. Der jetzige Stand in diesem Browser wird ersetzt.')) return;
        imported.baseRevision = Math.max(state.baseRevision, imported.revision);
        state = imported;
        ui.swipeIndex = 0;
        ui.listedId = null;
        saveAdminChange();
        setFlash('admin', 'success', 'Sicherung eingespielt.');
        render();
      }).catch(function () {
        setFlash('admin', 'error', 'Die Datei ist keine gültige ROMA-MATCH-Sicherung.');
        render();
      });
    }
  });

  // Defekte Bild-Adresse: statt eines kaputten Bildes den Anfangsbuchstaben zeigen.
  root.addEventListener('error', function (event) {
    var img = event.target;
    if (img.tagName !== 'IMG' || !img.hasAttribute('data-monogram')) return;
    var fallback = document.createElement('span');
    fallback.className = 'monogram';
    fallback.textContent = img.getAttribute('data-monogram');
    img.replaceWith(fallback);
  }, true);

  document.addEventListener('keydown', function (event) {
    if (event.key === 'Escape' && ui.matchedId) {
      ui.matchedId = null;
      render();
      return;
    }
    var typing = /^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement && document.activeElement.tagName);
    if (typing || isAdminView() || ui.tab !== 'swipe' || ui.matchedId) return;
    if (event.key === 'ArrowRight') swipe('like');
    if (event.key === 'ArrowLeft') swipe('nope');
  });

  window.addEventListener('hashchange', function () {
    ui.flash = null;
    ui.loginError = null;
    ui.matchedId = null;
    render();
    window.scrollTo(0, 0);
  });

  // Änderungen aus einem zweiten Tab derselben Seite übernehmen.
  window.addEventListener('storage', function (event) {
    if (event.key !== STORAGE_KEY) return;
    state = loadState();
    render();
  });

  render();
})();
</script>
</body>
</html>
