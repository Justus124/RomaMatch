<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ROMA MATCH – Dating im alten Rom</title>
<meta name="description" content="Ein Latein-Schulprojekt: Ovids „Ars amatoria“ im Vergleich mit modernen Dating-Apps.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
/* =========================================================
   ROMA MATCH – Einzeldatei-Version
   Dunkles Theme, Rosa (#e83e73) + Gold (#b98b52),
   Schriften: Cinzel (Überschriften) & Libre Baskerville (Fließtext)
   ========================================================= */

:root {
  --bg: #16100f;
  --surface: #221917;
  --surface-2: #2c211e;
  --surface-3: #372a26;
  --border: #4a3730;
  --border-soft: #3a2b26;

  --pink: #e83e73;
  --pink-soft: #f4739b;
  --pink-dark: #b02754;
  --gold: #b98b52;
  --gold-soft: #d8b483;
  --gold-dark: #8a6537;

  --text: #f4ece6;
  --text-muted: #bda99e;
  --text-dim: #8e7a70;

  --danger: #d9463f;
  --success: #4c9a6a;

  --radius: 14px;
  --radius-lg: 22px;
  --shadow: 0 18px 45px rgba(0, 0, 0, 0.55);
  --shadow-soft: 0 8px 24px rgba(0, 0, 0, 0.35);

  --font-display: 'Cinzel', 'Trajan Pro', Georgia, serif;
  --font-body: 'Libre Baskerville', Georgia, 'Times New Roman', serif;

  color-scheme: dark;
}

* { box-sizing: border-box; }

[hidden] { display: none !important; }

html, body { padding: 0; margin: 0; }

body {
  background-color: var(--bg);
  background-image:
    radial-gradient(circle at 15% 0%, rgba(232, 62, 115, 0.12), transparent 45%),
    radial-gradient(circle at 85% 10%, rgba(185, 139, 82, 0.14), transparent 50%),
    radial-gradient(circle at 50% 100%, rgba(232, 62, 115, 0.07), transparent 55%);
  background-attachment: fixed;
  color: var(--text);
  font-family: var(--font-body);
  font-size: 16px;
  line-height: 1.7;
  -webkit-font-smoothing: antialiased;
  min-height: 100vh;
}

h1, h2, h3, h4 {
  font-family: var(--font-display);
  font-weight: 700;
  letter-spacing: 0.06em;
  line-height: 1.25;
  margin: 0;
}

a { color: var(--pink-soft); text-decoration: none; }
a:hover { text-decoration: underline; }

::selection { background: var(--pink); color: #fff; }

code {
  font-family: ui-monospace, Consolas, 'Courier New', monospace;
  font-size: 0.85em;
  background: rgba(185, 139, 82, 0.14);
  color: var(--gold-soft);
  padding: 1px 7px;
  border-radius: 6px;
}

img { max-width: 100%; }

/* ---------- Layout ---------- */

.shell { max-width: 1120px; margin: 0 auto; padding: 0 20px 80px; }

.site-header { text-align: center; padding: 54px 0 8px; }

.laurel {
  display: flex; align-items: center; justify-content: center; gap: 14px;
  color: var(--gold);
  font-family: var(--font-display);
  font-size: 0.72rem;
  letter-spacing: 0.42em;
  text-transform: uppercase;
  margin: 0;
}
.laurel::before, .laurel::after {
  content: ''; height: 1px; width: 58px;
  background: linear-gradient(90deg, transparent, var(--gold-dark), transparent);
}

.site-title {
  font-size: clamp(2.6rem, 7vw, 4.4rem);
  margin: 14px 0 6px;
  background: linear-gradient(100deg, var(--gold-soft) 0%, var(--pink) 48%, var(--gold-soft) 100%);
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
}

.site-subtitle {
  color: var(--text-muted);
  font-size: 1rem;
  font-style: italic;
  margin: 0 auto;
  max-width: 620px;
}

.site-footer {
  border-top: 1px solid var(--border-soft);
  margin-top: 64px;
  padding-top: 24px;
  text-align: center;
  color: var(--text-dim);
  font-size: 0.82rem;
}
.site-footer p { margin: 6px 0; }

/* ---------- Tabs ---------- */

.tabs {
  display: flex; flex-wrap: wrap; justify-content: center; gap: 8px;
  margin: 34px 0 40px;
  padding: 8px;
  background: rgba(34, 25, 23, 0.75);
  border: 1px solid var(--border-soft);
  border-radius: 999px;
  backdrop-filter: blur(6px);
}

.tab {
  appearance: none;
  background: transparent;
  border: 0;
  border-radius: 999px;
  color: var(--text-muted);
  cursor: pointer;
  font-family: var(--font-display);
  font-size: 0.78rem;
  font-weight: 600;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  padding: 12px 22px;
  transition: color 0.18s ease, background 0.18s ease;
}
.tab:hover { color: var(--text); background: rgba(232, 62, 115, 0.1); }
.tab[aria-selected='true'] {
  background: linear-gradient(135deg, var(--pink) 0%, var(--pink-dark) 100%);
  color: #fff;
  box-shadow: 0 6px 18px rgba(232, 62, 115, 0.35);
}

/* ---------- Abschnittsköpfe ---------- */

.section-head { text-align: center; margin-bottom: 34px; }
.section-head h2 { font-size: clamp(1.5rem, 3.4vw, 2.1rem); color: var(--gold-soft); }
.section-head p { color: var(--text-muted); margin: 10px auto 0; max-width: 640px; font-size: 0.94rem; }

.eyebrow {
  color: var(--pink);
  font-family: var(--font-display);
  font-size: 0.7rem;
  letter-spacing: 0.32em;
  text-transform: uppercase;
  display: block;
  margin-bottom: 8px;
}

.card {
  background: linear-gradient(160deg, var(--surface) 0%, var(--surface-2) 100%);
  border: 1px solid var(--border-soft);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-soft);
}

/* ---------- SWIPEN ---------- */

.swipe-area { display: flex; flex-direction: column; align-items: center; gap: 22px; }

.swipe-stack { position: relative; width: min(420px, 100%); }
.swipe-stack::before, .swipe-stack::after {
  content: ''; position: absolute; inset: 0;
  border-radius: var(--radius-lg);
  border: 1px solid var(--border-soft);
  background: var(--surface);
  z-index: 0;
}
.swipe-stack::before { transform: rotate(-3deg) translateY(8px) scale(0.97); opacity: 0.5; }
.swipe-stack::after { transform: rotate(2.5deg) translateY(4px) scale(0.985); opacity: 0.7; }

.swipe-card {
  position: relative; z-index: 1; overflow: hidden;
  background: linear-gradient(165deg, var(--surface-2) 0%, var(--surface) 100%);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow);
  transition: transform 0.35s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.35s ease;
}
.swipe-card.leaving-like { transform: translateX(120%) rotate(16deg); opacity: 0; }
.swipe-card.leaving-nope { transform: translateX(-120%) rotate(-16deg); opacity: 0; }

.swipe-photo {
  position: relative;
  height: 300px;
  display: flex; align-items: center; justify-content: center;
  background:
    radial-gradient(circle at 50% 35%, rgba(185, 139, 82, 0.32), transparent 65%),
    linear-gradient(160deg, #3a2a25, #241a18);
  border-bottom: 1px solid var(--border);
  overflow: hidden;
}
.swipe-photo img { width: 100%; height: 100%; object-fit: cover; display: block; }

.monogram {
  font-family: var(--font-display);
  font-size: 6.5rem;
  color: var(--gold-soft);
  opacity: 0.65;
  text-shadow: 0 8px 30px rgba(0, 0, 0, 0.6);
  user-select: none;
}

.swipe-body { padding: 22px 24px 26px; }
.swipe-name { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.swipe-name h3 { font-size: 1.75rem; color: var(--text); }
.swipe-era { color: var(--gold); font-size: 0.82rem; letter-spacing: 0.05em; }
.swipe-status { color: var(--pink-soft); font-size: 0.85rem; font-style: italic; margin: 6px 0 12px; }
.swipe-description { color: var(--text-muted); font-size: 0.92rem; margin: 0 0 16px; }

.tag-row { display: flex; flex-wrap: wrap; gap: 8px; }
.tag {
  background: rgba(232, 62, 115, 0.12);
  border: 1px solid rgba(232, 62, 115, 0.35);
  border-radius: 999px;
  color: var(--pink-soft);
  font-size: 0.74rem;
  letter-spacing: 0.04em;
  padding: 5px 13px;
  white-space: nowrap;
}
.tag.gold { background: rgba(185, 139, 82, 0.12); border-color: rgba(185, 139, 82, 0.4); color: var(--gold-soft); }

.swipe-controls { display: flex; align-items: center; justify-content: center; gap: 26px; }

.circle-btn {
  width: 68px; height: 68px;
  border-radius: 50%;
  border: 2px solid var(--border);
  background: var(--surface-2);
  color: var(--text-muted);
  cursor: pointer;
  font-size: 1.6rem;
  display: grid; place-items: center;
  transition: transform 0.15s ease, box-shadow 0.2s ease, border-color 0.2s ease, color 0.2s ease, background 0.2s ease;
}
.circle-btn:hover { transform: scale(1.09); }
.circle-btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }
.circle-btn.nope:hover { border-color: var(--danger); color: var(--danger); }
.circle-btn.like { border-color: var(--pink); color: var(--pink); font-size: 1.9rem; }
.circle-btn.like:hover { background: var(--pink); color: #fff; box-shadow: 0 10px 30px rgba(232, 62, 115, 0.45); }

.swipe-counter {
  color: var(--text-dim);
  font-size: 0.8rem;
  letter-spacing: 0.1em;
  font-family: var(--font-display);
  margin: 0;
}

.likes-panel { width: min(560px, 100%); padding: 22px 24px; }
.likes-panel h3 { font-size: 1.05rem; color: var(--gold-soft); margin-bottom: 4px; }
.likes-panel .hint { color: var(--text-dim); font-size: 0.8rem; margin: 0 0 14px; }

.like-list {
  list-style: none; margin: 0; padding: 0;
  display: flex; flex-direction: column; gap: 8px;
  max-height: 260px; overflow-y: auto;
}
.like-item {
  display: flex; align-items: center; gap: 12px;
  background: rgba(232, 62, 115, 0.07);
  border: 1px solid rgba(232, 62, 115, 0.18);
  border-radius: 10px;
  padding: 9px 14px;
  font-size: 0.88rem;
}
.like-item .avatar {
  width: 30px; height: 30px; border-radius: 50%;
  background: linear-gradient(135deg, var(--pink), var(--gold-dark));
  color: #fff;
  display: grid; place-items: center;
  font-family: var(--font-display);
  font-size: 0.85rem;
  flex-shrink: 0;
}
.like-item time { margin-left: auto; color: var(--text-dim); font-size: 0.74rem; }

/* ---------- Match-Popup ---------- */

.overlay {
  position: fixed; inset: 0;
  background: rgba(10, 6, 6, 0.82);
  backdrop-filter: blur(5px);
  display: grid; place-items: center;
  padding: 20px;
  z-index: 60;
  animation: fade-in 0.22s ease;
}

.match-modal {
  width: min(460px, 100%);
  text-align: center;
  padding: 40px 32px 32px;
  border: 1px solid var(--gold-dark);
  border-radius: var(--radius-lg);
  background: linear-gradient(165deg, #2e2120 0%, #1c1413 100%);
  box-shadow: 0 0 90px rgba(232, 62, 115, 0.28), var(--shadow);
  animation: pop-in 0.32s cubic-bezier(0.22, 1.4, 0.5, 1);
}
.match-modal .heart {
  font-size: 3.6rem; color: var(--pink);
  animation: heartbeat 1.1s ease-in-out infinite;
  display: block; margin-bottom: 6px;
}
.match-modal h2 {
  font-size: 2.2rem;
  background: linear-gradient(100deg, var(--gold-soft), var(--pink), var(--gold-soft));
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
}
.match-modal .latin { font-style: italic; color: var(--gold); margin: 12px 0 4px; }
.match-modal p { color: var(--text-muted); font-size: 0.92rem; }

@keyframes heartbeat {
  0%, 100% { transform: scale(1); }
  14% { transform: scale(1.22); }
  28% { transform: scale(1); }
  42% { transform: scale(1.16); }
}
@keyframes pop-in {
  from { transform: scale(0.86) translateY(14px); opacity: 0; }
  to { transform: scale(1) translateY(0); opacity: 1; }
}
@keyframes fade-in { from { opacity: 0; } to { opacity: 1; } }

/* ---------- OVIDS TIPPS ---------- */

.tip-list { display: flex; flex-direction: column; gap: 22px; }
.tip-card { padding: 26px 28px; position: relative; overflow: hidden; }
.tip-card::before {
  content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 3px;
  background: linear-gradient(180deg, var(--pink), var(--gold));
}
.tip-head { display: flex; align-items: flex-start; gap: 16px; margin-bottom: 14px; }
.tip-number {
  flex-shrink: 0;
  width: 44px; height: 44px;
  display: grid; place-items: center;
  border-radius: 50%;
  border: 1px solid var(--gold-dark);
  color: var(--gold-soft);
  font-family: var(--font-display);
  font-size: 0.95rem;
  background: rgba(185, 139, 82, 0.1);
}
.tip-card h3 { font-size: 1.3rem; color: var(--text); }
.tip-source { color: var(--text-dim); font-size: 0.76rem; letter-spacing: 0.08em; font-family: var(--font-display); }
.tip-block { margin-top: 14px; }
.tip-label {
  color: var(--pink);
  font-family: var(--font-display);
  font-size: 0.68rem;
  letter-spacing: 0.24em;
  text-transform: uppercase;
  margin: 0 0 5px;
}
.tip-block p:not(.tip-label), .modern-box p:not(.tip-label) { margin: 0; color: var(--text-muted); font-size: 0.93rem; }

.quote-box {
  background: rgba(185, 139, 82, 0.08);
  border: 1px solid rgba(185, 139, 82, 0.28);
  border-left: 3px solid var(--gold);
  border-radius: 0 var(--radius) var(--radius) 0;
  padding: 16px 20px;
  margin: 14px 0 0;
}
.quote-latin { color: var(--gold-soft); font-size: 1.02rem; font-style: italic; margin: 0; }
.quote-translation {
  color: var(--text-muted);
  font-size: 0.88rem;
  margin: 8px 0 0;
  padding-top: 8px;
  border-top: 1px dashed rgba(185, 139, 82, 0.25);
}
.modern-box {
  background: rgba(232, 62, 115, 0.07);
  border: 1px solid rgba(232, 62, 115, 0.22);
  border-radius: var(--radius);
  padding: 16px 20px;
  margin-top: 14px;
}
.modern-box .tip-label { margin-bottom: 5px; }

/* ---------- DATE-SPOTS ---------- */

.spot { padding: 26px 28px; position: relative; overflow: hidden; }
.spot::before {
  content: ''; position: absolute; left: 0; right: 0; top: 0; height: 3px;
  background: linear-gradient(90deg, var(--pink), var(--gold));
}
.spot h4 {
  font-size: 0.82rem; letter-spacing: 0.14em; text-transform: uppercase;
  color: var(--gold-soft); margin: 0 0 8px;
}
.spot-hero { display: flex; align-items: center; gap: 18px; }
.spot-icon {
  width: 74px; height: 74px; flex-shrink: 0;
  display: grid; place-items: center;
  font-size: 2.3rem;
  border-radius: 50%;
  background: radial-gradient(circle at 35% 30%, rgba(232, 62, 115, 0.35), rgba(185, 139, 82, 0.15));
  border: 1px solid var(--gold-dark);
  box-shadow: 0 0 30px rgba(232, 62, 115, 0.25);
}
.spot-title h3 { font-size: 1.6rem; color: var(--text); }
.spot-title h3 em { font-family: var(--font-body); font-size: 0.95rem; font-weight: 400; color: var(--gold); letter-spacing: 0; }
.spot-rating { margin: 2px 0; color: var(--text-muted); font-size: 0.82rem; }
.spot-rating span { color: var(--pink); letter-spacing: 0.12em; font-size: 1rem; margin-right: 6px; }
.spot-title .tip-source { margin: 0; }

.spot-quote { margin: 20px 0 0; padding: 0 0 0 16px; border-left: 3px solid var(--gold); }
.spot-quote .quote-latin { font-size: 1.12rem; }
.spot-quote p:not(.quote-latin) { margin: 4px 0 0; color: var(--text-muted); font-size: 0.86rem; }

.spot-chips { list-style: none; padding: 0; margin: 20px 0 0; display: flex; flex-wrap: wrap; gap: 8px; }
.spot-chips li {
  display: flex; align-items: center; gap: 7px;
  background: rgba(185, 139, 82, 0.1);
  border: 1px solid rgba(185, 139, 82, 0.35);
  border-radius: 999px;
  padding: 6px 13px;
  font-size: 0.8rem;
  color: var(--gold-soft);
}

.spot-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; margin-top: 20px; }
.spot-bottom { display: grid; grid-template-columns: 3fr 2fr; gap: 14px; margin-top: 14px; align-items: start; }
.spot-box {
  background: rgba(15, 11, 10, 0.45);
  border: 1px solid var(--border-soft);
  border-radius: var(--radius);
  padding: 16px 18px;
}
.spot-box > p { margin: 0; color: var(--text-muted); font-size: 0.88rem; line-height: 1.6; }
.spot-mini-quote { margin: 12px 0 0 !important; padding-top: 10px; border-top: 1px dashed rgba(185, 139, 82, 0.3); color: var(--gold-soft) !important; font-style: italic; font-size: 0.86rem !important; }
.spot-mini-quote span { display: block; font-style: normal; color: var(--text-dim); font-size: 0.78rem; margin-top: 3px; }

.purpose-list { list-style: none; margin: 10px 0 0; padding: 0; display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.purpose-list li {
  display: flex; flex-direction: column; align-items: center; text-align: center;
  background: rgba(232, 62, 115, 0.09);
  border: 1px solid rgba(232, 62, 115, 0.28);
  border-radius: 12px;
  padding: 8px 4px;
}
.purpose-emoji { font-size: 1.3rem; line-height: 1.2; }
.purpose-list strong { font-size: 0.8rem; color: var(--text); }
.purpose-list em { font-size: 0.7rem; color: var(--pink-soft); }

.spot-warning {
  display: flex; align-items: center; gap: 16px;
  margin-top: 14px;
  background: rgba(217, 70, 63, 0.1);
  border: 1px solid rgba(217, 70, 63, 0.4);
  border-radius: var(--radius);
  padding: 14px 18px;
}
.spot-warning-icon { font-size: 1.8rem; color: #e8756f; flex-shrink: 0; }
.spot-warning .quote-latin { color: #f0a09b; }
.spot-warning p:not(.quote-latin) { margin: 3px 0 0; color: var(--text-muted); font-size: 0.86rem; }

.spot-today { background: rgba(232, 62, 115, 0.07); border-color: rgba(232, 62, 115, 0.25); }
.spot-today h4 { color: var(--pink-soft); }

.seat-plan { display: block; width: 100%; max-width: 360px; margin: 4px auto 10px; }
.seat-plan .seat-senate { fill: rgba(185, 139, 82, 0.55); }
.seat-plan .seat-knights { fill: rgba(185, 139, 82, 0.32); }
.seat-plan .seat-people { fill: rgba(189, 169, 158, 0.16); }
.seat-plan .seat-women { fill: rgba(232, 62, 115, 0.55); }
.seat-plan .seat-stage { fill: var(--surface-3); stroke: var(--border); }
.seat-label { fill: var(--text); font-family: var(--font-display); font-size: 12px; letter-spacing: 0.1em; }
.seat-label-strong { font-weight: 700; }
.seat-label-stage { fill: var(--text-dim); font-size: 10px; letter-spacing: 0.3em; }

@media (max-width: 860px) {
  .spot-grid, .spot-bottom { grid-template-columns: 1fr; }
}
@media (max-width: 640px) {
  .spot { padding: 22px 18px; }
  .spot-icon { width: 58px; height: 58px; font-size: 1.8rem; }
  .spot-title h3 { font-size: 1.3rem; }
}

.spot-grid-4 { grid-template-columns: repeat(2, 1fr); }
.spot-number {
  margin: 0 0 2px; color: var(--pink);
  font-family: var(--font-display); font-size: 0.66rem; letter-spacing: 0.3em; text-transform: uppercase;
}
.spot-warning-title {
  margin: 0 0 2px !important; color: #e8756f !important;
  font-family: var(--font-display); font-size: 0.68rem !important; letter-spacing: 0.24em; text-transform: uppercase;
}

.spot-compare { width: 100%; border-collapse: collapse; margin: 6px 0 12px; font-size: 0.84rem; }
.spot-compare th, .spot-compare td { padding: 8px 10px; text-align: left; border-bottom: 1px solid var(--border-soft); }
.spot-compare thead th { color: var(--gold-soft); font-family: var(--font-display); font-size: 0.74rem; letter-spacing: 0.08em; }
.spot-compare tbody th { color: var(--text-dim); font-weight: 400; font-size: 0.78rem; }
.spot-compare td { color: var(--text-muted); }
.spot-compare td:last-child { color: var(--pink-soft); }
.spot-compare tr:last-child th, .spot-compare tr:last-child td { border-bottom: 0; }

.spot-full { margin-top: 14px; border: 1px solid var(--border-soft); border-radius: var(--radius); background: rgba(15, 11, 10, 0.35); }
.spot-full summary {
  cursor: pointer; padding: 12px 18px;
  color: var(--gold-soft); font-family: var(--font-display); font-size: 0.78rem; letter-spacing: 0.12em;
}
.spot-full summary:hover { color: var(--text); }
.spot-full dl { margin: 0; padding: 4px 18px 16px; }
.spot-full dt { color: var(--gold-soft); font-style: italic; margin-top: 12px; font-size: 0.92rem; }
.spot-full dd { margin: 3px 0 0; color: var(--text-muted); font-size: 0.86rem; }

@media (max-width: 860px) {
  .spot-grid-4 { grid-template-columns: 1fr; }
}
@media (max-width: 640px) {
  .spot-compare th, .spot-compare td { padding: 7px 5px; font-size: 0.76rem; }
}

/* ---------- COMMUNITY ---------- */

.community-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(270px, 1fr)); gap: 20px; }
.community-card {
  padding: 22px;
  display: flex; flex-direction: column; gap: 10px;
  transition: transform 0.2s ease, border-color 0.2s ease;
}
.community-card:hover { transform: translateY(-4px); border-color: rgba(232, 62, 115, 0.45); }
.community-head { display: flex; align-items: center; gap: 12px; }
.community-avatar {
  width: 48px; height: 48px; border-radius: 50%;
  display: grid; place-items: center;
  background: linear-gradient(140deg, var(--pink-dark), var(--gold-dark));
  color: #fff;
  font-family: var(--font-display);
  font-size: 1.2rem;
  flex-shrink: 0;

.community-card h3 { font-size: 1.1rem; }

.community-bio { color: var(--text-muted); font-size: 0.88rem; margin: 0; }
.liked-badge {
  display: flex; align-items: center; gap: 6px;
  color: var(--pink);
  font-size: 0.78rem;
  margin-top: auto;
  padding-top: 6px;
}
.liked-badge time { margin-left: auto; color: var(--text-dim); font-size: 0.74rem; }

.form-card { padding: 30px 32px; max-width: 640px; margin: 0 auto; }
.field { margin-bottom: 18px; }
.field label {
  display: block;
  color: var(--gold-soft);
  font-family: var(--font-display);
  font-size: 0.72rem;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  margin-bottom: 7px;
}

input[type='text'], input[type='number'], input[type='password'], textarea {
  width: 100%;
  background: rgba(15, 11, 10, 0.7);
  border: 1px solid var(--border);
  border-radius: 10px;
  color: var(--text);
  font-family: var(--font-body);
  font-size: 0.94rem;
  padding: 12px 14px;
  transition: border-color 0.18s ease, box-shadow 0.18s ease;
}
input:focus, textarea:focus {
  outline: none;
  border-color: var(--pink);
  box-shadow: 0 0 0 3px rgba(232, 62, 115, 0.18);
}
textarea { min-height: 110px; resize: vertical; line-height: 1.6; }
textarea.short { min-height: 70px; }

.help { color: var(--text-dim); font-size: 0.76rem; margin: 6px 0 0; }

.checkbox-field {
  display: flex; align-items: flex-start; gap: 12px;
  background: rgba(232, 62, 115, 0.07);
  border: 1px solid rgba(232, 62, 115, 0.22);
  border-radius: var(--radius);
  padding: 14px 16px;
  margin-bottom: 20px;
  cursor: pointer;
}
.checkbox-field input { width: 20px; height: 20px; accent-color: var(--pink); margin-top: 2px; flex-shrink: 0; cursor: pointer; }
.checkbox-field span { font-size: 0.9rem; color: var(--text); }
.checkbox-field small { color: var(--text-dim); font-size: 0.8rem; }

.form-row { display: grid; grid-template-columns: 2fr 1fr; gap: 16px; }

.btn {
  appearance: none;
  display: inline-block;
  border: 1px solid transparent;
  border-radius: 999px;
  cursor: pointer;
  font-family: var(--font-display);
  font-size: 0.78rem;
  font-weight: 600;
  letter-spacing: 0.14em;
  padding: 13px 28px;
  text-transform: uppercase;
  text-decoration: none;
  line-height: 1.4;
  transition: transform 0.15s ease, box-shadow 0.2s ease, background 0.2s ease, border-color 0.2s ease, color 0.2s ease;
}
.btn:hover:not(:disabled) { transform: translateY(-2px); text-decoration: none; }
.btn:disabled { opacity: 0.55; cursor: not-allowed; }
.btn-primary {
  background: linear-gradient(135deg, var(--pink) 0%, var(--pink-dark) 100%);
  color: #fff;
  box-shadow: 0 8px 22px rgba(232, 62, 115, 0.32);

.btn-gold { background: linear-gradient(135deg, var(--gold-soft) 0%, var(--gold-dark) 100%); color: #241a18; }
.btn-ghost { background: transparent; border-color: var(--border); color: var(--text-muted); }

.btn-sm { padding: 8px 16px; font-size: 0.68rem; }
.btn-block { width: 100%; }

.file-btn { position: relative; overflow: hidden; }
.file-btn input { position: absolute; inset: 0; opacity: 0; cursor: pointer; font-size: 0; }

.alert { border-radius: 10px; font-size: 0.88rem; padding: 12px 16px; margin: 0 0 18px; }
.alert-error { background: rgba(217, 70, 63, 0.14); border: 1px solid rgba(217, 70, 63, 0.4); color: #f0a09b; }
.alert-success { background: rgba(76, 154, 106, 0.14); border: 1px solid rgba(76, 154, 106, 0.4); color: #9fd7b6; }
.alert-note { background: rgba(185, 139, 82, 0.1); border: 1px solid rgba(185, 139, 82, 0.4); color: var(--gold-soft); }

.empty-state {

  color: var(--text-dim);
  padding: 46px 20px;
  border: 1px dashed var(--border);
  border-radius: var(--radius-lg);
  font-style: italic;
  margin: 0;
}

.admin-bar {

.admin-list { display: flex; flex-direction: column; gap: 12px; margin-top: 22px; }
.admin-row {
  display: flex; align-items: center; gap: 14px;

  border-radius: var(--radius);
  padding: 14px 16px;

.admin-row .grow { flex: 1; min-width: 0; }
.admin-row strong { display: block; font-family: var(--font-display); font-size: 0.98rem; color: var(--text); }

.admin-row .small-number {

.admin-row .small-avatar { width: 38px; height: 38px; font-size: 1rem; }

      for (var t = 0; t < 16; t++) W[t] = view.getUint32(i + t * 4);
      for (t = 16; t < 64; t++) {
        var s0 = ror(W[t - 15], 7) ^ ror(W[t - 15], 18) ^ (W[t - 15] >>> 3);
        var s1 = ror(W[t - 2], 17) ^ ror(W[t - 2], 19) ^ (W[t - 2] >>> 10);
        W[t] = (W[t - 16] + s0 + W[t - 7] + s1) >>> 0;
      }
      var a = H[0], b = H[1], c = H[2], d = H[3], e = H[4], f = H[5], g = H[6], h = H[7];
      for (t = 0; t < 64; t++) {
        var S1 = ror(e, 6) ^ ror(e, 11) ^ ror(e, 25);
        var ch = (e & f) ^ (~e & g);
        var t1 = (h + S1 + ch + K[t] + W[t]) >>> 0;
        var S0 = ror(a, 2) ^ ror(a, 13) ^ ror(a, 22);
        var maj = (a & b) ^ (a & c) ^ (b & c);
        var t2 = (S0 + maj) >>> 0;
        h = g; g = f; f = e; e = (d + t1) >>> 0;
        d = c; c = b; b = a; a = (t1 + t2) >>> 0;
      }
      H[0] = (H[0] + a) >>> 0; H[1] = (H[1] + b) >>> 0; H[2] = (H[2] + c) >>> 0; H[3] = (H[3] + d) >>> 0;
      H[4] = (H[4] + e) >>> 0; H[5] = (H[5] + f) >>> 0; H[6] = (H[6] + g) >>> 0; H[7] = (H[7] + h) >>> 0;
    }
    return H.map(function (v) { return v.toString(16).padStart(8, '0'); }).join('');
  }

  function hashPassword(password) { return sha256(PASSWORD_SALT + password); }

  // Zugriffe auf den Browserspeicher können werfen (privater Modus,
  // gesperrte Website-Daten) – dann läuft die Seite ohne Speichern weiter.
  function storageGet(store, key) {
    try { return store.getItem(key); } catch (e) { return null; }
  }
  function storageSet(store, key, value) {
    try { store.setItem(key, value); return true; } catch (e) { return false; }
  }
  function storageRemove(store, key) {
    try { store.removeItem(key); } catch (e) { /* egal */ }
  }

  /* =======================================================
     Daten: laden, prüfen, speichern
     ======================================================= */

  function text(value, max) {
    return (typeof value === 'string' ? value : value == null ? '' : String(value)).trim().slice(0, max);
  }
  function wholeNumber(value, min, max, fallback) {
    var n = Number(value);
    return Number.isInteger(n) && n >= min && n <= max ? n : fallback;
  }
  function isoDate(value) {
    var d = new Date(value);
    return isNaN(d.getTime()) ? nowIso() : d.toISOString();
  }
  function idOf(value) {
    return typeof value === 'string' && value ? value.slice(0, 60) : uid();
  }
  /** Nur echte Bild-Adressen zulassen – keine javascript:-URLs o. Ä. */
  function safeImage(value) {
    var url = text(value, 3000000);
    return /^(https?:\/\/|data:image\/(png|jpe?g|gif|webp);base64,)/i.test(url) ? url : '';
  }

  /**
   * Bringt beliebige (auch importierte oder beschädigte) Daten in eine
   * saubere Form. Likes, deren Profil nicht mehr existiert, fallen dabei weg.
   */
  function normalize(raw) {
    if (!raw || typeof raw !== 'object') throw new Error('Keine gültigen ROMA-MATCH-Daten.');
    var list = function (x) { return Array.isArray(x) ? x : []; };

    var profiles = list(raw.profiles).map(function (p) {
      return {
        id: idOf(p.id), name: text(p.name, 80), era: text(p.era, 120), status: text(p.status, 160),
        description: text(p.description, 2000), tags: splitTags(p.tags), imageUrl: safeImage(p.imageUrl),
        sortOrder: wholeNumber(p.sortOrder, 0, 999, 0), createdAt: isoDate(p.createdAt)
      };
    }).filter(function (p) { return p.name; });

    var tips = list(raw.tips).map(function (t) {
      return {
        id: idOf(t.id), title: text(t.title, 160), ovidIdea: text(t.ovidIdea, 2000),
        latinQuote: text(t.latinQuote, 1000), translation: text(t.translation, 1000),
        modernInterpretation: text(t.modernInterpretation, 2000), source: text(t.source, 120),
        sortOrder: wholeNumber(t.sortOrder, 0, 999, 0), createdAt: isoDate(t.createdAt)
      };
    }).filter(function (t) { return t.title; });

    var community = list(raw.community).map(function (c) {
      return {
        id: idOf(c.id), name: text(c.name, 60), age: wholeNumber(c.age, 10, 120, 18),
        bio: text(c.bio, 1000), interests: splitTags(c.interests), likedOvid: !!c.likedOvid,
        createdAt: isoDate(c.createdAt), own: !!c.own
      };
    }).filter(function (c) { return c.name; });

    var profileIds = {}, communityIds = {};
    profiles.forEach(function (p) { profileIds[p.id] = true; });
    community.forEach(function (c) { communityIds[c.id] = true; });

    var likes = list(raw.likes).map(function (l) {
      return {
        id: idOf(l.id), profileId: text(l.profileId, 60), likerName: text(l.likerName, 60) || 'Anonymus',
        userProfileId: l.userProfileId ? text(l.userProfileId, 60) : null,
        createdAt: isoDate(l.createdAt), own: !!l.own
      };
    }).filter(function (l) {
      return profileIds[l.profileId] && (!l.userProfileId || communityIds[l.userProfileId]);
    });

    return {
      version: 1,
      revision: wholeNumber(raw.revision, 0, Number.MAX_SAFE_INTEGER, 0),
      baseRevision: wholeNumber(raw.baseRevision, 0, Number.MAX_SAFE_INTEGER, 0),
      adminHash: /^[0-9a-f]{64}$/.test(raw.adminHash) ? raw.adminHash : DEFAULT_ADMIN_HASH,
      dirty: !!raw.dirty,
      profiles: profiles, tips: tips, community: community, likes: likes
    };
  }

  /** Die Inhalte, die in dieser HTML-Datei selbst stecken. */
  function fileData() {
    var embedded = null;
    try { embedded = JSON.parse(document.getElementById('roma-data').textContent); } catch (e) { embedded = null; }
    var data = normalize(embedded || DEFAULT_DATA);
    data.baseRevision = data.revision;
    data.dirty = false;
    return data;
  }

  /**
   * Was im Browser gespeichert ist, gewinnt – außer die Datei selbst ist neuer
   * (der Admin hat eine neue Fassung hochgeladen). Dann kommen Profile, Tipps
   * und Community aus der Datei, und nur die eigenen Einträge dieses Browsers
   * (eigenes Profil, eigene Likes) bleiben erhalten.
   */
  function loadState() {
    var base = fileData();
    var stored = null;
    try { stored = normalize(JSON.parse(storageGet(localStorage, STORAGE_KEY))); } catch (e) { stored = null; }
    if (!stored) return base;
    if (stored.baseRevision >= base.revision) return stored;

    var baseCommunity = {}, baseLikes = {};
    base.community.forEach(function (c) { baseCommunity[c.id] = true; });
    base.likes.forEach(function (l) { baseLikes[l.id] = true; });

    var ownCommunity = stored.community.filter(function (c) { return c.own && !baseCommunity[c.id]; });
    var ownLikes = stored.likes.filter(function (l) { return l.own && !baseLikes[l.id]; });

    return normalize({
      revision: base.revision, baseRevision: base.revision, adminHash: base.adminHash, dirty: false,
      profiles: base.profiles, tips: base.tips,
      community: ownCommunity.concat(base.community),
      likes: ownLikes.concat(base.likes)
    });
  }

  var state = loadState();

  function save() {
    var ok = storageSet(localStorage, STORAGE_KEY, JSON.stringify(state));
    if (!ok) {
      setFlash('global', 'error', 'Speichern im Browser fehlgeschlagen – vermutlich ist der Speicher voll (große Bilder?) oder für diese Seite gesperrt. Die letzte Änderung gilt nur bis zum Neuladen.');
    }
    return ok;
  }

  /** Admin-Änderung: merken, dass sie noch nicht veröffentlicht ist. */
  function saveAdminChange() {
    state.dirty = true;
    return save();
  }

  function sortedProfiles() {
    return state.profiles.slice().sort(function (a, b) {
      return a.sortOrder - b.sortOrder || a.createdAt.localeCompare(b.createdAt);
    });
  }
  function sortedTips() {
    return state.tips.slice().sort(function (a, b) {
      return a.sortOrder - b.sortOrder || a.createdAt.localeCompare(b.createdAt);
    });
  }
  function sortedCommunity() {
    return state.community.slice().sort(function (a, b) { return b.createdAt.localeCompare(a.createdAt); });
  }
  function likesFor(profileId) {
    return state.likes.filter(function (l) { return l.profileId === profileId; })
      .sort(function (a, b) { return b.createdAt.localeCompare(a.createdAt); });
  }
  function findById(listName, id) {
    return state[listName].filter(function (item) { return item.id === id; })[0] || null;
  }

  /** Halbring (obere Hälfte) für den Sitzplan – r1 = 0 ergibt einen Halbkreis. */
  function arcBand(cx, cy, r1, r2) {
    var outer = 'M' + (cx - r2) + ',' + cy + ' A' + r2 + ',' + r2 + ' 0 0 1 ' + (cx + r2) + ',' + cy;
    if (!r1) return outer + ' Z';
    return outer + ' L' + (cx + r1) + ',' + cy + ' A' + r1 + ',' + r1 + ' 0 0 0 ' + (cx - r1) + ',' + cy + ' Z';
  }

  function seatingPlan() {
    var cx = 200, cy = 176;
    var bands = [
      [0, 42, 'seat-senate', 'Senatoren'],
      [46, 92, 'seat-knights', 'Ritter'],
      [96, 140, 'seat-people', 'Volk'],
      [144, 172, 'seat-women', 'Frauen']
    ];
    return '<svg class="seat-plan" viewBox="0 0 400 210" role="img" aria-label="Sitzplan eines römischen Theaters: vorne Senatoren, dann Ritter, dann Volk, ganz oben die Frauen">' +
      bands.map(function (b) {
        var labelY = cy - (b[0] + b[1]) / 2 + 5;
        return '<path class="' + b[2] + '" d="' + arcBand(cx, cy, b[0], b[1]) + '"></path>' +
          '<text x="' + cx + '" y="' + (b[0] ? labelY : cy - 14) + '" text-anchor="middle" class="seat-label' + (b[2] === 'seat-women' ? ' seat-label-strong' : '') + '">' + b[3] + '</text>';
      }).join('') +
      '<rect class="seat-stage" x="60" y="182" width="280" height="22" rx="4"></rect>' +
      '<text x="200" y="197" text-anchor="middle" class="seat-label seat-label-stage">BÜHNE</text>' +
    '</svg>';
  }

  function compareTable(rows) {
    return '<table class="spot-compare"><thead><tr>' +
      rows[0].map(function (h) { return '<th scope="col">' + esc(h) + '</th>'; }).join('') +
      '</tr></thead><tbody>' +
      rows.slice(1).map(function (r) {
        return '<tr><th scope="row">' + esc(r[0]) + '</th><td>' + esc(r[1]) + '</td><td>' + esc(r[2]) + '</td></tr>';
      }).join('') +
    '</tbody></table>';
  }

                '<div class="row-actions">' +
                  '<time datetime="' + esc(p.createdAt) + '" style="color:var(--text-dim);font-size:0.74rem">' + formatDate(p.createdAt) + '</time>' +
                  '<button type="button" class="btn btn-danger btn-sm" data-action="delete-community" data-id="' + esc(p.id) + '">Löschen</button>' +
                '</div>' +
              '</div>';
          }).join('') +
        '</div>' +
      '</section>';
  }

  function renderDataSection() {
    var sizeKb = Math.round(JSON.stringify(state).length / 1024);
    return '' +
      '<section class="card admin-panel">' +
        '<h2>Daten &amp; Veröffentlichen</h2>' +
        '<p class="panel-hint">Alles, was hier geändert wird, speichert zunächst nur dieser Browser (belegt: ca. ' + sizeKb + ' KB von etwa 5 000 KB). Andere Besucher sehen es erst, wenn die neue HTML-Datei die alte ersetzt.</p>' +
        flashHtml('admin') +
        '<div class="data-grid">' +
          '<div class="admin-form">' +
            '<h3>Für alle sichtbar machen</h3>' +
            '<p class="intro">Lädt diese Seite als neue <code>roma-match.html</code> herunter – mit allen aktuellen Profilen, Tipps, Community-Einträgen, Likes und dem Admin-Passwort. Diese Datei auf den Server laden bzw. weitergeben. Wer sie öffnet, bekommt die neuen Inhalte; eigene Profile und Likes in seinem Browser bleiben erhalten.</p>' +
            '<button type="button" class="btn btn-gold" data-action="export-html">HTML-Datei herunterladen</button>' +
          '</div>' +
          '<div class="admin-form">' +
            '<h3>Sicherung</h3>' +
            '<p class="intro">Alle Inhalte als JSON-Datei sichern oder eine Sicherung zurückspielen. Beim Einspielen werden die Inhalte in diesem Browser ersetzt.</p>' +
            '<div class="form-buttons">' +
              '<button type="button" class="btn btn-ghost btn-sm" data-action="export-json">JSON exportieren</button>' +
              '<label class="btn btn-ghost btn-sm file-btn">JSON importieren …<input type="file" id="import-file" accept="application/json,.json"></label>' +
            '</div>' +
          '</div>' +
          '<form class="admin-form" data-form="password">' +
            '<h3>Admin-Passwort ändern</h3>' +
            '<div class="field"><label for="pw-current">Aktuelles Passwort</label><input id="pw-current" name="current" type="password" required autocomplete="current-password"></div>' +
            '<div class="field"><label for="pw-new">Neues Passwort</label><input id="pw-new" name="next" type="password" required minlength="6" autocomplete="new-password"></div>' +
            '<div class="field"><label for="pw-repeat">Neues Passwort wiederholen</label><input id="pw-repeat" name="repeat" type="password" required minlength="6" autocomplete="new-password"></div>' +
            '<button type="submit" class="btn btn-primary btn-sm">Passwort ändern</button>' +
          '</form>' +
          '<div class="admin-form">' +
            '<h3>Zurücksetzen</h3>' +
            '<p class="intro">Likes leeren, etwa vor einer Präsentation – oder alle Änderungen in diesem Browser verwerfen und zum Stand der Datei zurückkehren.</p>' +
            '<div class="form-buttons">' +
              '<button type="button" class="btn btn-danger btn-sm" data-action="clear-likes">Alle Likes löschen</button>' +
              '<button type="button" class="btn btn-danger btn-sm" data-action="reset-all">Auf Stand der Datei zurücksetzen</button>' +
            '</div>' +
          '</div>' +
        '</div>' +
      '</section>';
  }

  /* =======================================================
     Rendern
     ======================================================= */

  var root = document.getElementById('root');

  function render() {
    var admin = isAdminView();
    root.innerHTML = admin ? renderAdmin() : renderPublic();
    document.title = admin ? 'Admin · ROMA MATCH' : 'ROMA MATCH – Dating im alten Rom';

    var focusTarget = root.querySelector('[data-autofocus]') || root.querySelector('#match-close');
    if (focusTarget) focusTarget.focus();
  }

  function scrollToForm() {
    var form = document.getElementById('admin-form');
    if (form) form.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }

  /** Zeigt einen Fehler oben im Formular, ohne die Eingaben zu verlieren. */
  function formError(form, message) {
    var box = form.querySelector('.alert-error[data-form-error]');
    if (!box) {
      box = document.createElement('p');
      box.className = 'alert alert-error';
      box.setAttribute('data-form-error', '');
      var anchor = form.querySelector('h3');
      if (anchor) anchor.insertAdjacentElement('afterend', box); else form.insertBefore(box, form.firstChild);
    }
    box.textContent = message;
    box.scrollIntoView({ behavior: 'smooth', block: 'center' });
  }

  function download(filename, content, type) {
    var blob = new Blob([content], { type: type });
    var url = URL.createObjectURL(blob);
    var link = document.createElement('a');
    link.href = url;
    link.download = filename;
    document.body.appendChild(link);
    link.click();
    setTimeout(function () { URL.revokeObjectURL(url); link.remove(); }, 1000);
  }

  /** Stand zum Weitergeben: ohne browserinterne Markierungen. */
  function exportData(revision) {
    var copy = clone(state);
    copy.revision = revision;
    delete copy.baseRevision;
    delete copy.dirty;
    copy.community.forEach(function (c) { delete c.own; });
    copy.likes.forEach(function (l) { delete l.own; });
    return copy;
  }

  function readImageFile(file) {
    return new Promise(function (resolve, reject) {
      if (!file || !/^image\//.test(file.type)) { reject(new Error('Bitte eine Bilddatei auswählen.')); return; }
      var reader = new FileReader();
      reader.onerror = function () { reject(new Error('Die Datei konnte nicht gelesen werden.')); };
      reader.onload = function () {
        var img = new Image();
        img.onerror = function () { reject(new Error('Das Bild konnte nicht geöffnet werden.')); };
        img.onload = function () {
          // Verkleinern, damit der Browserspeicher (ca. 5 MB) nicht volläuft.
          var max = 640;
          var scale = Math.min(1, max / Math.max(img.width, img.height));
          var canvas = document.createElement('canvas');
          canvas.width = Math.max(1, Math.round(img.width * scale));
          canvas.height = Math.max(1, Math.round(img.height * scale));
          var ctx = canvas.getContext('2d');
          ctx.fillStyle = '#2c211e';
          ctx.fillRect(0, 0, canvas.width, canvas.height);
          ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
          resolve(canvas.toDataURL('image/jpeg', 0.82));
        };
        img.src = reader.result;
      };
      reader.readAsDataURL(file);
    });
  }

  function setImagePreview(src) {
    var preview = document.getElementById('mp-image-preview');
    if (!preview) return;
    preview.hidden = !src;
    preview.querySelector('img').src = src || '';
  }

  /* =======================================================
     Aktionen (Klicks)
     ======================================================= */

  function swipe(direction) {
    var profiles = sortedProfiles();
    var current = profiles[ui.swipeIndex];
    if (!current || ui.swipeBusy) return;
    ui.swipeBusy = true;

    var card = document.getElementById('swipe-card');
    if (card) card.classList.add(direction === 'like' ? 'leaving-like' : 'leaving-nope');
    root.querySelectorAll('.circle-btn').forEach(function (b) { b.disabled = true; });

    if (direction === 'like') {
      state.likes.push({
        id: uid(), profileId: current.id, likerName: likerName().trim() || 'Anonymus',
        userProfileId: null, createdAt: nowIso(), own: true
      });
      save();
      ui.listedId = current.id;
    }

    setTimeout(function () {
      ui.swipeBusy = false;
      ui.swipeIndex += 1;
      if (direction === 'like') ui.matchedId = current.id;
      render();
    }, 340);
  }

  var actions = {
    noop: function () {},

    tab: function (el) {
      ui.tab = el.getAttribute('data-tab');
      ui.flash = null;
      render();
    },
    like: function () { swipe('like'); },
    nope: function () { swipe('nope'); },
    restart: function () { ui.swipeIndex = 0; render(); },
    'close-match': function () { ui.matchedId = null; render(); },

    'admin-tab': function (el) {
      ui.adminSection = el.getAttribute('data-section');
      ui.flash = null;
      ui.editTipId = null;
      ui.editProfileId = null;
      render();
    },
    logout: function () {
      storageRemove(sessionStorage, SESSION_KEY);
      ui.flash = null;
      render();
    },
    'cancel-edit': function () {
      ui.editTipId = null;
      ui.editProfileId = null;
      ui.flash = null;
      render();
    },

    'edit-tip': function (el) {
      ui.editTipId = el.getAttribute('data-id');
      ui.flash = null;
      render();
      scrollToForm();
    },
    'delete-tip': function (el) {
      var tip = findById('tips', el.getAttribute('data-id'));
      if (!tip || !confirm('Tipp „' + tip.title + '“ wirklich löschen?')) return;
      state.tips = state.tips.filter(function (t) { return t.id !== tip.id; });
      if (ui.editTipId === tip.id) ui.editTipId = null;
      saveAdminChange();
      setFlash('admin', 'success', 'Tipp „' + tip.title + '“ gelöscht.');
      render();
    },

    'edit-profile': function (el) {
      ui.editProfileId = el.getAttribute('data-id');
      ui.flash = null;
      render();
      scrollToForm();
    },
    'delete-profile': function (el) {
      var profile = findById('profiles', el.getAttribute('data-id'));
      if (!profile) return;
      var count = likesFor(profile.id).length;
      if (!confirm('Profil „' + profile.name + '“ löschen? ' + plural(count, 'zugehöriges Like wird', 'zugehörige Likes werden') + ' mit entfernt.')) return;
      state.profiles = state.profiles.filter(function (p) { return p.id !== profile.id; });
      state.likes = state.likes.filter(function (l) { return l.profileId !== profile.id; });
      if (ui.editProfileId === profile.id) ui.editProfileId = null;
      if (ui.listedId === profile.id) ui.listedId = null;
      ui.swipeIndex = 0;
      saveAdminChange();
      setFlash('admin', 'success', 'Profil „' + profile.name + '“ gelöscht.');
      render();
    },
    'remove-image': function () {
      var urlInput = document.getElementById('mp-image-url');
      var dataInput = document.getElementById('mp-image-data');
      if (urlInput) urlInput.value = '';
      if (dataInput) dataInput.value = '';
      setImagePreview('');
    },

    'delete-community': function (el) {
      var person = findById('community', el.getAttribute('data-id'));
      if (!person || !confirm('Profil von „' + person.name + '“ endgültig löschen?')) return;
      state.community = state.community.filter(function (c) { return c.id !== person.id; });
      // Das über die Checkbox entstandene Ovid-Like gehört zum Profil.
      state.likes = state.likes.filter(function (l) { return l.userProfileId !== person.id; });
      saveAdminChange();
      setFlash('admin', 'success', 'Profil von ' + person.name + ' gelöscht.');
      render();
    },

    'export-html': function () {
      var revision = Date.now();
      var json = JSON.stringify(exportData(revision), null, 1).replace(/</g, '\\u003c');
      var doc = document.documentElement.cloneNode(true);
      doc.querySelector('#root').innerHTML = '';
      doc.querySelector('#roma-data').textContent = json;
      download('roma-match.html', '<!DOCTYPE html>\n' + doc.outerHTML, 'text/html;charset=utf-8');

      // Dieser Browser kennt den Stand jetzt – öffnet der Admin die neue
      // Datei hier, gilt sie nicht als "neuer" und nichts wird überschrieben.
      state.revision = revision;
      state.baseRevision = revision;
      state.dirty = false;
      save();
      setFlash('admin', 'success', 'HTML-Datei erstellt. Jetzt die alte roma-match.html damit ersetzen (z. B. auf dem Server) – dann sehen alle den neuen Stand.');
      render();
    },
    'export-json': function () {
      var stamp = new Date().toISOString().slice(0, 10);
      download('roma-match-sicherung-' + stamp + '.json', JSON.stringify(exportData(state.revision), null, 2), 'application/json');
      setFlash('admin', 'success', 'Sicherung heruntergeladen.');
      render();
    },
    'clear-likes': function () {
      if (!confirm('Wirklich alle ' + plural(state.likes.length, 'Like', 'Likes') + ' löschen?')) return;
      state.likes = [];
      saveAdminChange();
      setFlash('admin', 'success', 'Alle Likes gelöscht.');
      render();
    },
    'reset-all': function () {
      if (!confirm('Alle Änderungen in diesem Browser verwerfen und zum Stand der Datei zurückkehren?')) return;
      storageRemove(localStorage, STORAGE_KEY);
      state = fileData();
      save();
      ui.swipeIndex = 0;
      ui.listedId = null;
      ui.editTipId = null;
      ui.editProfileId = null;
      if (!isLoggedIn()) { location.hash = '#start'; return; }
      setFlash('admin', 'success', 'Zurückgesetzt auf den Stand der Datei.');
      render();
    }
  };

  /* =======================================================
     Formulare
     ======================================================= */

  function formValues(form) {
    var values = {};
    new FormData(form).forEach(function (value, key) { values[key] = typeof value === 'string' ? value.trim() : value; });
    return values;
  }

  var forms = {
    community: function (form) {
      var v = formValues(form);
      var age = Number(v.age);
      if (!v.name) return formError(form, 'Bitte einen Namen eintragen.');
      if (!Number.isInteger(age) || age < 10 || age > 120) return formError(form, 'Das Alter muss zwischen 10 und 120 liegen.');
      if (!v.bio) return formError(form, 'Bitte ein paar Worte über dich schreiben.');

      var person = {
        id: uid(), name: v.name.slice(0, 60), age: age, bio: v.bio.slice(0, 1000),
        interests: splitTags(v.interests), likedOvid: v.likedOvid === 'on', createdAt: nowIso(), own: true
      };
      state.community.push(person);

      var message = 'Profil gespeichert. ' + person.name + ' steht jetzt im Community-Bereich.';
      if (person.likedOvid) {
        var ovid = sortedProfiles().filter(function (p) { return /ovid/i.test(p.name); })[0];
        if (ovid) {
          state.likes.push({
            id: uid(), profileId: ovid.id, likerName: person.name, userProfileId: person.id,
            createdAt: nowIso(), own: true
          });
          message += ' Dein Like für Ovid wurde ebenfalls eingetragen.';
        }
      }
      save();
      setFlash('profile', 'success', message);
      render();
    },

    login: function (form) {
      var v = formValues(form);
      if (hashPassword(v.password || '') === state.adminHash) {
        storageSet(sessionStorage, SESSION_KEY, state.adminHash);
        ui.loginError = null;
        ui.flash = null;
      } else {
        ui.loginError = 'Falsches Passwort.';
      }
      render();
    },

    tip: function (form) {
      var v = formValues(form);
      var required = [['title', 'Titel'], ['ovidIdea', 'Ovids Idee'], ['latinQuote', 'Lateinisches Zitat'],
        ['translation', 'Deutsche Übersetzung'], ['modernInterpretation', 'Moderne Interpretation']];
      for (var i = 0; i < required.length; i++) {
        if (!v[required[i][0]]) return formError(form, 'Das Feld „' + required[i][1] + '“ darf nicht leer sein.');
      }
      var data = {
        title: v.title.slice(0, 160), ovidIdea: v.ovidIdea.slice(0, 2000), latinQuote: v.latinQuote.slice(0, 1000),
        translation: v.translation.slice(0, 1000), modernInterpretation: v.modernInterpretation.slice(0, 2000),
        source: (v.source || '').slice(0, 120), sortOrder: wholeNumber(v.sortOrder, 0, 999, 0)
      };
      var existing = ui.editTipId ? findById('tips', ui.editTipId) : null;
      if (existing) {
        Object.assign(existing, data);
        setFlash('admin', 'success', 'Tipp „' + data.title + '“ gespeichert.');
      } else {
        data.id = uid();
        data.createdAt = nowIso();
        state.tips.push(data);
        setFlash('admin', 'success', 'Tipp „' + data.title + '“ angelegt.');
      }
      ui.editTipId = null;
      saveAdminChange();
      render();
    },

    profile: function (form) {
      var v = formValues(form);
      var required = [['name', 'Name'], ['era', 'Zeitalter'], ['status', 'Stand'], ['description', 'Beschreibung']];
      for (var i = 0; i < required.length; i++) {
        if (!v[required[i][0]]) return formError(form, 'Das Feld „' + required[i][1] + '“ darf nicht leer sein.');
      }
      var image = v.imageData || v.imageUrlText || '';
      if (image && !safeImage(image)) {
        return formError(form, 'Die Bild-Adresse muss mit https:// oder http:// beginnen.');
      }
      var data = {
        name: v.name.slice(0, 80), era: v.era.slice(0, 120), status: v.status.slice(0, 160),
        description: v.description.slice(0, 2000), tags: splitTags(v.tags), imageUrl: safeImage(image),
        sortOrder: wholeNumber(v.sortOrder, 0, 999, 0)
      };
      var existing = ui.editProfileId ? findById('profiles', ui.editProfileId) : null;
      if (existing) {
        Object.assign(existing, data);
        setFlash('admin', 'success', 'Profil „' + data.name + '“ gespeichert.');
      } else {
        data.id = uid();
        data.createdAt = nowIso();
        state.profiles.push(data);
        setFlash('admin', 'success', 'Profil „' + data.name + '“ angelegt.');
      }
      ui.editProfileId = null;
      ui.swipeIndex = 0;
      saveAdminChange();
      render();
    },

    password: function (form) {
      var v = formValues(form);
      if (hashPassword(v.current || '') !== state.adminHash) return formError(form, 'Das aktuelle Passwort stimmt nicht.');
      if ((v.next || '').length < 6) return formError(form, 'Das neue Passwort braucht mindestens 6 Zeichen.');
      if (v.next !== v.repeat) return formError(form, 'Die beiden neuen Passwörter stimmen nicht überein.');
      state.adminHash = hashPassword(v.next);
      storageSet(sessionStorage, SESSION_KEY, state.adminHash);
      saveAdminChange();
      setFlash('admin', 'success', 'Passwort geändert. In anderen Browsern gilt es erst, wenn dort die neu heruntergeladene HTML-Datei geöffnet wird.');
      render();
    }
  };

  /* =======================================================
     Ereignisse
     ======================================================= */

  root.addEventListener('click', function (event) {
    var el = event.target.closest('[data-action]');
    if (!el || !root.contains(el)) return;
    var handler = actions[el.getAttribute('data-action')];
    if (handler) handler(el, event);
  });

  root.addEventListener('submit', function (event) {
    var form = event.target.closest('form[data-form]');
    if (!form) return;
    event.preventDefault();
    var handler = forms[form.getAttribute('data-form')];
    if (handler) handler(form);
  });

  root.addEventListener('input', function (event) {
    if (event.target.id === 'liker-name') storageSet(localStorage, NAME_KEY, event.target.value.trim());
    if (event.target.id === 'mp-image-url') {
      var dataInput = document.getElementById('mp-image-data');
      if (dataInput) dataInput.value = '';
      setImagePreview(safeImage(event.target.value));
    }
  });

  root.addEventListener('change', function (event) {
    var input = event.target;

    if (input.id === 'mp-image-file' && input.files && input.files[0]) {
      readImageFile(input.files[0]).then(function (dataUrl) {
        document.getElementById('mp-image-data').value = dataUrl;
        document.getElementById('mp-image-url').value = '';
        setImagePreview(dataUrl);
      }).catch(function (error) {
        formError(document.getElementById('admin-form'), error.message);
      });
      input.value = '';
    }

    if (input.id === 'import-file' && input.files && input.files[0]) {
      var file = input.files[0];
      input.value = '';
      file.text().then(function (content) {
        var imported = normalize(JSON.parse(content));
        if (!confirm('Inhalte aus „' + file.name + '“ übernehmen? ' + plural(imported.profiles.length, 'Profil', 'Profile') + ', ' + plural(imported.tips.length, 'Tipp', 'Tipps') + ', ' + plural(imported.community.length, 'Community-Profil', 'Community-Profile') + '. Der jetzige Stand in diesem Browser wird ersetzt.')) return;
        imported.baseRevision = Math.max(state.baseRevision, imported.revision);
        state = imported;
        ui.swipeIndex = 0;
        ui.listedId = null;
        saveAdminChange();
        setFlash('admin', 'success', 'Sicherung eingespielt.');
        render();
      }).catch(function () {
        setFlash('admin', 'error', 'Die Datei ist keine gültige ROMA-MATCH-Sicherung.');
        render();
      });
    }
  });

  // Defekte Bild-Adresse: statt eines kaputten Bildes den Anfangsbuchstaben zeigen.
  root.addEventListener('error', function (event) {
    var img = event.target;
    if (img.tagName !== 'IMG' || !img.hasAttribute('data-monogram')) return;
    var fallback = document.createElement('span');
    fallback.className = 'monogram';
    fallback.textContent = img.getAttribute('data-monogram');
    img.replaceWith(fallback);
  }, true);

  document.addEventListener('keydown', function (event) {
    if (event.key === 'Escape' && ui.matchedId) {
      ui.matchedId = null;
      render();
      return;
    }
    var typing = /^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement && document.activeElement.tagName);
    if (typing || isAdminView() || ui.tab !== 'swipe' || ui.matchedId) return;
    if (event.key === 'ArrowRight') swipe('like');
    if (event.key === 'ArrowLeft') swipe('nope');
  });

  window.addEventListener('hashchange', function () {
    ui.flash = null;
    ui.loginError = null;
    ui.matchedId = null;
    render();
    window.scrollTo(0, 0);
  });

  // Änderungen aus einem zweiten Tab derselben Seite übernehmen.
  window.addEventListener('storage', function (event) {
    if (event.key !== STORAGE_KEY) return;
    state = loadState();
    render();
  });

  render();
})();
</script>
</body>
</html>
